[build-system]
requires = ["setuptools", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
scopez = ["icons/*.png"]

# --- Project Settings ---
[project]
name = "scopez"
version = "v0.2.1"
description = "Scopez verifies connectivity to target servers, reveals CDN presence, and provides detailed target insights like reachability and RDAP."
readme = "README.md"
requires-python = ">3.11"
license = { file = "LICENSE" }
authors = [{ name = "Christos Kaltsas", email = "christos@xcalts.co" }]
maintainers = [{ name = "Christos Kaltsas", email = "christos@xcalts.co" }]

# --- Required Dependencies ---
dependencies = [
    # Command-line interface.
    "click==8.5.0",
    # REST HTTP client.
    "requests==2.34.2",
    # HTTP library used by requests (imported directly to silence InsecureRequestWarning).
    "urllib3==2.8.0",
    # Rich text and beautiful formatting in the terminal.
    "rich==15.0.0",
    # Data validation and models.
    "pydantic==2.14.2",
    # Retrieve and parse RDAP/whois data for IP addresses.
    "ipwhois==1.3.0",
    # DNS toolkit used to follow CNAME chains and resolve A records.
    "dnspython==2.9.1",
    # Validates fully-qualified domain names against RFC 1123.
    "fqdn==1.6.0",
    # Loads the GeoIP CSV database.
    "pandas==3.1.0",
    # Network graph for -visual.
    "networkx==3.7",
    # Renders the -visual network graph.
    "matplotlib==3.11.2",
    # Node positions for the -visual network graph.
    "numpy==2.5.4",
    # Loads the node icons for the -visual network graph.
    "pillow==13.0.0",
    # Required by networkx's kamada_kawai_layout (-visual).
    "scipy==1.18.1",
]

# --- URLs ---
[project.urls]
"Homepage" = "https://github.com/xcalts/scopez"
"Source" = "https://github.com/xcalts/scopez"
"Documentation" = "https://github.com/xcalts/scopez"
"Bug Reports" = "https://github.com/xcalts/scopez/issues"
"Changelog" = "https://github.com/xcalts/scopez/releases"

# --- Scripts ---
[project.scripts]
scopez = "main:cli"

# --- Lint ---
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.isort]
section-order = [
    "third-party",
    "standard-library",
    "first-party",
    "local-folder",
]
force-sort-within-sections = true
lines-after-imports = 2
